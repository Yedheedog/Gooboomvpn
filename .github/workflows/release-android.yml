name: Publish Android release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version like 1.0.0, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing BUST THE GATE v$VERSION"

      - name: Fetch pinned OpenVPN 3 source
        run: bash scripts/fetch-openvpn3.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install host pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Install pinned Android native dependencies
        run: bash scripts/install-android-native-deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          KEYSTORE_PATH="$RUNNER_TEMP/bust-the-gate-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and package debug and release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify, name, and checksum APKs
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            "$AAPT" dump badging "$apk" | grep -F "package: name='com.example.vpngate'"
            for abi in arm64-v8a x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libopenvpn3_jni.so" >/dev/null
            done
          done

          "$APKSIGNER" verify --verbose "$DEBUG_APK"
          "$APKSIGNER" verify --verbose "$RELEASE_APK"

          mkdir -p release-assets
          cp "$DEBUG_APK" "release-assets/VPN-Gate-Connect-v${VERSION}-debug.apk"
          cp "$RELEASE_APK" "release-assets/VPN-Gate-Connect-v${VERSION}-release.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
          {
            echo "### Release verification"
            echo "- Version: v${VERSION}"
            echo "- Application ID: com.example.vpngate"
            echo "- ABIs: arm64-v8a, x86_64"
            echo "- Debug APK signature: verified"
            echo "- Release APK signature: verified with the configured PKCS12 release key"
            echo "- SHA-256 checksums: included"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BUST THE GATE v${{ steps.release.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
