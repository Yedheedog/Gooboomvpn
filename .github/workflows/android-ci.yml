name: Android source checks

on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch pinned OpenVPN 3 source
        run: bash scripts/fetch-openvpn3.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Install host pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - name: Install pinned Android native dependencies
        run: bash scripts/install-android-native-deps.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Kotlin and native library (no APK packaging)
        run: gradle --no-daemon :app:compileDebugKotlin :app:externalNativeBuildDebug
