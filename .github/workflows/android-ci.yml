name: Android source checks and diagnostic APKs

on:
  push:
    branches: [main, "work/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest source-check run for a branch; avoid wasting CI on stale commits.
concurrency:
  group: android-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Fetch pinned OpenVPN 3 source
        run: bash scripts/fetch-openvpn3.sh
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - name: Install host pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config
      - name: Install pinned Android native dependencies
        run: bash scripts/install-android-native-deps.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create temporary diagnostic signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/bust-the-gate-diagnostic.p12"
          keytool -genkeypair -noprompt \
            -alias diagnostic \
            -keyalg RSA -keysize 2048 -validity 2 \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_PATH" \
            -storepass diagnostic-only -keypass diagnostic-only \
            -dname "CN=BUST THE GATE Diagnostic Build"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=diagnostic-only" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=diagnostic" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=diagnostic-only" >> "$GITHUB_ENV"
      - name: Run tests and package both diagnostic APK variants
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease
      - name: Verify diagnostic APKs
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$DEBUG_APK" | grep -F "package: name='com.example.vpngate.diagnostic.debug'"
          "$AAPT" dump badging "$RELEASE_APK" | grep -F "package: name='com.example.vpngate.diagnostic.release'"
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            for abi in arm64-v8a x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libopenvpn3_jni.so" >/dev/null
            done
            "$APKSIGNER" verify --verbose "$apk"
          done
          mkdir -p diagnostic-apks
          cp "$DEBUG_APK" diagnostic-apks/BUST-THE-GATE-auth-diagnostics-debug.apk
          cp "$RELEASE_APK" diagnostic-apks/BUST-THE-GATE-auth-diagnostics-release.apk
          sha256sum diagnostic-apks/*.apk > diagnostic-apks/SHA256SUMS.txt
          cat diagnostic-apks/SHA256SUMS.txt
      - name: Upload diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: bust-the-gate-auth-diagnostics
          path: diagnostic-apks/*
          if-no-files-found: error
          retention-days: 7
