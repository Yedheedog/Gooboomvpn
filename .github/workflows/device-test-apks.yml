name: Device-test APK build

# Device-test builds package both variants after source checks pass.
on:
  workflow_dispatch:
  push:
    branches:
      - "device-test/**"
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: device-test-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-device-test-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch pinned OpenVPN 3 source
        run: bash scripts/fetch-openvpn3.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install host pkg-config
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Install pinned Android native dependencies
        run: bash scripts/install-android-native-deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and package debug and release APKs
        run: |
          gradle --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify APK contents and debug signature
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          NUMBERED_DEBUG_APK="$(dirname "$DEBUG_APK")/VPN-Gate-Connect-debug-build-${GITHUB_RUN_NUMBER}.apk"
          mv "$DEBUG_APK" "$NUMBERED_DEBUG_APK"
          DEBUG_APK="$NUMBERED_DEBUG_APK"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            "$AAPT" dump badging "$apk" | grep -F "package: name='com.example.vpngate'"
            for abi in arm64-v8a x86_64; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/libopenvpn3_jni.so" >/dev/null
            done
          done

          "$APKSIGNER" verify --verbose "$DEBUG_APK"
          echo "Debug APK: $DEBUG_APK (debug-key signed; installable test build)" >> "$GITHUB_STEP_SUMMARY"
          echo "Release APK: $RELEASE_APK (unsigned; package/ABI contents verified)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload device-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: vpn-gate-connect-device-test-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
